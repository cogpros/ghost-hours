name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unittest suites
        run: python -m unittest discover -s tests -v
      - name: Run export privacy regression
        run: python tests/test_export_privacy.py
